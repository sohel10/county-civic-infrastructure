<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>County Health Comparison Tool</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .global-search-wrapper { max-width: 600px; margin: 0 auto 20px; position: relative; }
        .global-search-wrapper input { width: 100%; padding: 12px 16px; font-size: 15px; border: 2px solid #3498db; border-radius: 8px; }
        #searchResults { display: none; position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #ddd; max-height: 300px; overflow-y: auto; z-index: 100; border-radius: 6px; }
        .search-item { padding: 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .search-item:hover { background: #f8f9fa; }
        .search-item.selected { background: #e8f8f5; }
        #comparePanel { display: none; background: #f0f4f8; border: 2px solid #3498db; border-radius: 12px; padding: 16px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>County Health Comparison Tool</h1>
            <p class="subtitle">Poverty vs Health Status | 2023 Census + CDC Data | 3,135 US Counties</p>
        </div>

        <!-- GLOBAL SEARCH -->
        <div class="global-search-wrapper">
            <input type="text" id="globalSearchInput" placeholder="🔍 Search any county across all 50 states (e.g., 'Wayne')...">
            <div id="searchResults"></div>
        </div>

        <!-- COMPARISON PANEL -->
        <div id="comparePanel"></div>

        <div class="controls">
            <select id="stateSelect" onchange="loadByState()">
                <option value="">-- Select State --</option>
            </select>
            <button onclick="loadCounties()">📊 Show All</button>
            <button onclick="runComparison()" style="background-color:#27ae60">📈 Compare</button>
            <button onclick="exportComparison()" style="background-color:#f39c12">📥 Export PDF</button>
        </div>

        <div class="search-filter-box">
            <input type="text" id="searchInput" class="search-input" placeholder="Search county...">
            <button class="search-btn" onclick="searchCounty()">Search</button>
            <button class="reset-btn" onclick="resetSearch()">Reset</button>
        </div>

        <div id="summaryStats" class="summary-stats" style="display:none;">
            <div class="stat-item">
                <div class="stat-label">AVG POVERTY %</div>
                <div class="stat-value" id="avgPoverty">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">AVG DIABETES %</div>
                <div class="stat-value" id="avgDiabetes">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">AVG OBESITY %</div>
                <div class="stat-value" id="avgObesity">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">COUNTIES LOADED</div>
                <div class="stat-value" id="totalCounties">0</div>
            </div>
        </div>

        <div class="content-wrapper">
            <div id="results"></div>
        </div>

        <div style="margin-top:30px; padding:15px; background:#f0f0f0; border-radius:8px; font-size:12px;">
            <strong>Data:</strong> 2023 US Census Bureau (Poverty) + 2023 CDC PLACES (Diabetes, Obesity) | 3,135 counties
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
