<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>County Health Comparison</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>County Health Comparison Tool</h1>
        <p class="subtitle">Explore health disparities across 3,142 US counties</p>

        <div class="controls">
            <select id="stateSelect" onchange="loadByState()">
                <option value="">-- Select State --</option>
            </select>
            <button onclick="loadCounties()">Show All</button>
            <button onclick="compareSelected()" style="background-color:#27ae60">📊 Compare Selected</button>
        </div>

        <div id="stats"></div>
        
        <div class="content-wrapper">
            <div id="results"></div>
            <div id="chartContainer">
                <h2>📊 County Comparison Chart</h2>
                <canvas id="comparisonChart"></canvas>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
